<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fees · Hostel Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="fa-solid fa-building-columns"></i>Dormix Hostel</div>
  <nav>
    <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
    <a href="rooms.html"><i class="fa-solid fa-door-open"></i> Rooms</a>
    <a href="allocation.html"><i class="fa-solid fa-bed"></i> Allocation</a>
    <a href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
    <a href="payments.html"><i class="fa-solid fa-receipt"></i> Payments</a>
  </nav>
  <a href="#" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1>Fees</h1>
        <div class="sub">Track fee balances and record payments</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="panel">
      <div class="filter-bar">
        <input type="text" class="form-control" id="searchInput" placeholder="Search by name or register no.">
        <select class="form-select" id="statusFilter">
          <option value="">All Statuses</option>
          <option>Pending</option><option>Partial</option><option>Paid</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="app-table">
          <thead>
            <tr>
              <th>Register No.</th><th>Student</th><th>Total Fee</th><th>Paid</th>
              <th>Balance</th><th>Status</th><th>Last Payment</th><th></th>
            </tr>
          </thead>
          <tbody id="feesBody"></tbody>
        </table>
      </div>
      <div id="feesEmpty"></div>
    </div>
  </div>
</div>

<!-- Add Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="paymentForm">
        <div class="modal-header">
          <h5 class="modal-title">Record Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="paymentStudentId">
          <p class="mb-3" id="paymentStudentInfo"></p>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Amount (₹) *</label>
              <input type="number" min="1" step="0.01" class="form-control" id="amount" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Payment Date *</label>
              <input type="date" class="form-control" id="payment_date" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Payment Method *</label>
              <select class="form-select" id="payment_method" required>
                <option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Transaction ID</label>
              <input type="text" class="form-control" id="transaction_id">
            </div>
            <div class="col-12">
              <label class="form-label">Remarks</label>
              <input type="text" class="form-control" id="remarks">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Save Payment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Fee Details / Payment History Modal -->
<div class="modal fade" id="feeDetailsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Fee Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="feeDetailsBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/fees.js"></script>
</body>
</html>
