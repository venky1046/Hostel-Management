<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms · Hostel Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <i class="fa-solid fa-building-columns"></i> Hostel MS
      </div>
      <nav>
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="students.html"
          ><i class="fa-solid fa-user-graduate"></i> Students</a
        >
        <a href="rooms.html"><i class="fa-solid fa-door-open"></i> Rooms</a>
        <a href="allocation.html"><i class="fa-solid fa-bed"></i> Allocation</a>
        <a href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
        <a href="payments.html"><i class="fa-solid fa-receipt"></i> Payments</a>
      </nav>
      <a href="#" class="logout" id="logoutBtn"
        ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
      >
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <h1>Rooms</h1>
            <div class="sub">Manage hostel rooms and availability</div>
          </div>
        </div>
        <button class="btn btn-accent" onclick="openAddRoom()">
          <i class="fa-solid fa-plus me-1"></i> Add Room
        </button>
      </div>

      <div class="content">
        <div class="panel">
          <div class="filter-bar">
            <input
              type="text"
              class="form-control"
              id="searchInput"
              placeholder="Search by room number"
            />
            <select class="form-select" id="typeFilter">
              <option value="">All Types</option>
              <option>Normal4</option>
              <option>Normal2</option>
              <option>NRI2</option>
            </select>
            <select class="form-select" id="statusFilter">
              <option value="">All Statuses</option>
              <option>Available</option>
              <option>Full</option>
              <option>Maintenance</option>
            </select>
          </div>

          <div class="table-wrap">
            <table class="app-table">
              <thead>
                <tr>
                  <th>Room No.</th>
                  <th>Type</th>
                  <th>Capacity</th>
                  <th>Occupied</th>
                  <th>Available</th>
                  <th>Bathroom</th>
                  <th>AC</th>
                  <th>Fee</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="roomsBody"></tbody>
            </table>
          </div>
          <div id="roomsEmpty"></div>
        </div>
      </div>
    </div>

    <!-- Add / Edit Room Modal -->
    <div class="modal fade" id="roomModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="roomForm">
            <div class="modal-header">
              <h5 class="modal-title" id="roomModalTitle">Add Room</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="roomId" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Room Number *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="room_number"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Room Type *</label>
                  <select
                    class="form-select"
                    id="room_type"
                    required
                    onchange="applyRoomTypeDefaults()"
                  >
                    <option value="">Select</option>
                    <option value="Normal4">Normal4</option>
                    <option value="Normal2">Normal2</option>
                    <option value="NRI2">NRI2</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Capacity *</label>
                  <input
                    type="number"
                    min="1"
                    class="form-control"
                    id="capacity"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Fee (₹) *</label>
                  <input
                    type="number"
                    min="0"
                    class="form-control"
                    id="fee"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Bathroom Type *</label>
                  <select class="form-select" id="bathroom_type" required>
                    <option value="Common">Common</option>
                    <option value="Attached">Attached</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Status</label>
                  <select class="form-select" id="status">
                    <option>Available</option>
                    <option>Full</option>
                    <option>Maintenance</option>
                  </select>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="ac_available"
                    />
                    <label class="form-check-label" for="ac_available"
                      >AC Available</label
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-navy"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-accent">Save Room</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Room Details Modal -->
    <div class="modal fade" id="roomDetailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Room Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="roomDetailsBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/rooms.js"></script>
  </body>
</html>
