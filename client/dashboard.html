<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Hostel Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="fa-solid fa-building-columns"></i> Hostel MS</div>
  <nav>
    <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
    <a href="rooms.html"><i class="fa-solid fa-door-open"></i> Rooms</a>
    <a href="allocation.html"><i class="fa-solid fa-bed"></i> Allocation</a>
    <a href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
    <a href="payments.html"><i class="fa-solid fa-receipt"></i> Payments</a>
  </nav>
  <a href="#" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1>Dashboard</h1>
        <div class="sub">Overview of students, rooms and fees</div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="row g-3 mb-2" id="statCards">
      <!-- stat cards injected by dashboard.js -->
    </div>

    <div class="row g-3 mt-1">
      <div class="col-lg-6">
        <div class="panel">
          <h2>Room occupancy by type</h2>
          <canvas id="occupancyChart" height="180"></canvas>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel">
          <h2>Fee collection (last 6 months)</h2>
          <canvas id="feeChart" height="180"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-lg-4">
        <div class="panel">
          <h2>Recent students</h2>
          <div id="recentStudents"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="panel">
          <h2>Recent payments</h2>
          <div id="recentPayments"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="panel">
          <h2>Recent allocations</h2>
          <div id="recentAllocations"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
