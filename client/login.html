<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Hostel Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand-mark"><i class="fa-solid fa-building-columns"></i>DORMIX-HOSTEL</div>
    <p class="tag">Admin sign in</p>

    <div id="loginError" class="alert alert-danger py-2 px-3 d-none"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          autocomplete="username"
          required
        >
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-accent w-100 py-2 mt-2">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign in
      </button>
    </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();

  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const errBox = document.getElementById('loginError');

  // Demo-only front-end check
  if (u === 'admin' && p === 'admin123') {
    localStorage.setItem('hms_logged_in', 'true');
    window.location.href = 'dashboard.html';
  } else {
    errBox.textContent = 'Invalid username or password.';
    errBox.classList.remove('d-none');
  }
});
</script>

</body>
</html>
