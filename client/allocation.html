<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allocation · Hostel Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="fa-solid fa-building-columns"></i>Dormix Hostel</div>
  <nav>
    <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
    <a href="rooms.html"><i class="fa-solid fa-door-open"></i> Rooms</a>
    <a href="allocation.html"><i class="fa-solid fa-bed"></i> Allocation</a>
    <a href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
    <a href="payments.html"><i class="fa-solid fa-receipt"></i> Payments</a>
  </nav>
  <a href="#" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1>Room Allocation</h1>
        <div class="sub">Assign students to available rooms</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="row g-3">
      <div class="col-lg-5">
        <div class="panel">
          <h2>New Allocation</h2>

          <label class="form-label">Student</label>
          <select class="form-select mb-2" id="studentSelect" onchange="showStudentPreview()">
            <option value="">Select a student…</option>
          </select>
          <div id="studentPreview" class="small text-muted mb-3"></div>

          <label class="form-label">Available Room</label>
          <select class="form-select mb-2" id="roomSelect" onchange="showRoomPreview()">
            <option value="">Select a room…</option>
          </select>
          <div id="roomPreview" class="small text-muted mb-3"></div>

          <button class="btn btn-accent w-100" onclick="confirmAllocate()">
            <i class="fa-solid fa-bed me-1"></i> Allocate Room
          </button>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="panel">
          <h2>Allocation History</h2>
          <div class="table-wrap">
            <table class="app-table">
              <thead>
                <tr><th>Student</th><th>Room</th><th>Date</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="allocationsBody"></tbody>
            </table>
          </div>
          <div id="allocationsEmpty"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/allocation.js"></script>
</body>
</html>
