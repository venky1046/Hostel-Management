<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments · Hostel Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="fa-solid fa-building-columns"></i>Dormix Hostel</div>
  <nav>
    <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
    <a href="rooms.html"><i class="fa-solid fa-door-open"></i> Rooms</a>
    <a href="allocation.html"><i class="fa-solid fa-bed"></i> Allocation</a>
    <a href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
    <a href="payments.html"><i class="fa-solid fa-receipt"></i> Payments</a>
  </nav>
  <a href="#" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1>Payments</h1>
        <div class="sub">Complete record of every payment received</div>
      </div>
    </div>
    <a href="fees.html" class="btn btn-accent"><i class="fa-solid fa-plus me-1"></i> Record Payment</a>
  </div>

  <div class="content">
    <div class="panel">
      <div class="filter-bar">
        <input type="text" class="form-control" id="searchInput" placeholder="Search by name, register no. or transaction ID">
      </div>

      <div class="table-wrap">
        <table class="app-table">
          <thead>
            <tr>
              <th>Date</th><th>Student</th><th>Register No.</th><th>Amount</th>
              <th>Method</th><th>Transaction ID</th><th>Remarks</th>
            </tr>
          </thead>
          <tbody id="paymentsBody"></tbody>
        </table>
      </div>
      <div id="paymentsEmpty"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/payments.js"></script>
</body>
</html>
