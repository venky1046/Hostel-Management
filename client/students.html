<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students · Hostel Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="fa-solid fa-building-columns"></i> Hostel MS</div>
  <nav>
    <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="students.html"><i class="fa-solid fa-user-graduate"></i> Students</a>
    <a href="rooms.html"><i class="fa-solid fa-door-open"></i> Rooms</a>
    <a href="allocation.html"><i class="fa-solid fa-bed"></i> Allocation</a>
    <a href="fees.html"><i class="fa-solid fa-money-bill-wave"></i> Fees</a>
    <a href="payments.html"><i class="fa-solid fa-receipt"></i> Payments</a>
  </nav>
  <a href="#" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</aside>

<div class="main">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h1>Students</h1>
        <div class="sub">Manage student records</div>
      </div>
    </div>
    <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#studentModal" onclick="openAddStudent()">
      <i class="fa-solid fa-plus me-1"></i> Add Student
    </button>
  </div>

  <div class="content">
    <div class="panel">
      <div class="filter-bar">
        <input type="text" class="form-control" id="searchInput" placeholder="Search by name or register no.">
        <select class="form-select" id="departmentFilter">
          <option value="">All Departments</option>
          <option>CSE</option><option>ECE</option><option>EEE</option>
          <option>MECH</option><option>CIVIL</option><option>IT</option>
        </select>
        <select class="form-select" id="yearFilter">
          <option value="">All Years</option>
          <option value="1">1st Year</option><option value="2">2nd Year</option>
          <option value="3">3rd Year</option><option value="4">4th Year</option>
        </select>
        <select class="form-select" id="genderFilter">
          <option value="">All Genders</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="app-table">
          <thead>
            <tr>
              <th>Register No.</th><th>Name</th><th>Gender</th><th>Department</th>
              <th>Year</th><th>Mobile</th><th>Room Pref.</th><th>7.5% Res.</th><th></th>
            </tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
      <div id="studentsEmpty"></div>
    </div>
  </div>
</div>

<!-- Add / Edit Student Modal -->
<div class="modal fade" id="studentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="studentForm">
        <div class="modal-header">
          <h5 class="modal-title" id="studentModalTitle">Add Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="studentId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Register Number *</label>
              <input type="text" class="form-control" id="register_no" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Student Name *</label>
              <input type="text" class="form-control" id="student_name" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Gender *</label>
              <select class="form-select" id="gender" required>
                <option value="">Select</option>
                <option>Male</option><option>Female</option><option>Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Department *</label>
              <select class="form-select" id="department" required>
                <option value="">Select</option>
                <option>CSE</option><option>ECE</option><option>EEE</option>
                <option>MECH</option><option>CIVIL</option><option>IT</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Year *</label>
              <select class="form-select" id="year" required>
                <option value="">Select</option>
                <option value="1">1st Year</option><option value="2">2nd Year</option>
                <option value="3">3rd Year</option><option value="4">4th Year</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Mobile *</label>
              <input type="text" class="form-control" id="mobile" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Parent Mobile</label>
              <input type="text" class="form-control" id="parent_mobile">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Room Preference *</label>
              <select class="form-select" id="room_preference" required>
                <option value="">Select</option>
                <option value="Normal4">Normal 4 — ₹100,000</option>
                <option value="Normal2">Normal 2 — ₹120,000</option>
                <option value="NRI2">NRI 2 — ₹140,000</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="address" rows="2"></textarea>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="reservation_7_5">
                <label class="form-check-label" for="reservation_7_5">7.5% Reservation</label>
              </div>
            </div>
          </div>
          <p class="text-muted small mt-3 mb-0" id="feeNote"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-accent">Save Student</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Student Details Modal -->
<div class="modal fade" id="detailsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Student Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/students.js"></script>
</body>
</html>
